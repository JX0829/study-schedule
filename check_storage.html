<!DOCTYPE html>
<html>
<head><title>检查存储</title></head>
<body>
<h1>localStorage 数据检查</h1>
<script>
const keys = [];
for (let i = 0; i < localStorage.length; i++) {
  keys.push(localStorage.key(i));
}

const studyPlanKeys = keys.filter(k => k.startsWith('studyplan_'));

document.write('<h2>所有 studyplan_ 相关键：</h2>');
document.write('<pre>');

studyPlanKeys.forEach(key => {
  const value = localStorage.getItem(key);
  try {
    const parsed = JSON.parse(value);
    document.write(key + ':\n' + JSON.stringify(parsed, null, 2).substring(0, 500) + '\n\n');
  } catch {
    document.write(key + ': ' + value + '\n\n');
  }
});

document.write('</pre>');
</script>
</body>
</html>
